# competency-question: display text describing the question a query answers, one per query.
# Ollaya selects using the readable SPARQL of every query.
# parameters: what fills each query parameter: a property label = one of its ABOX values (written in the question, else an
# Ollaya choice over them plus none), date = from/to from the quarter, month or year written in the question. Per query,
# `params` are required (none found = the query is not run); the values are the examples `make sparql` runs without ARGS.
# Confidence cutoffs (0..1, inclusive): query selection, then model-based parameter choices.
min-confidence: 0.4
parameter-min-confidence: 0.4
parameters:
  acronym: acronym
  from: date
  to: date
queries:
  q01-total-expenses-by-project:
    competency-question: "How do total expenses compare across European projects?"
  q02-project-expense-breakdown:
    competency-question: "What is the breakdown of one European project's expenses by expense category?"
    params: {acronym: LUMEN}
  q03-travel-expenses-by-project:
    competency-question: "How do travel expenses compare across projects?"
  q04-expenses-by-work-package:
    competency-question: "What are the total expenses by work package?"
  q05-budget-vs-spent:
    competency-question: "How do project budget, spent amount and remaining budget compare?"
  q06-ineligible-expenses:
    competency-question: "Which expenses are marked as ineligible?"
  q07-expenses-by-employee:
    competency-question: "What are the total expenses associated with each employee?"
  q08-expenses-by-supplier:
    competency-question: "What are the total expenses by supplier?"
  q09-monthly-expenses:
    competency-question: "What are the monthly expense totals?"
  q10-project-expenses-in-period:
    competency-question: "Which project expenses fall within a date range?"
    params: {acronym: LUMEN, from: "2026-01-01", to: "2026-03-31"}
